<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Pro Bio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; perspective: 2000px;
        }

        #bg-parallax {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1; object-fit: cover;
            filter: brightness(0.5) blur(2px);
            transform: scale(1.1);
            transition: transform 0.4s cubic-bezier(0.1, 0, 0.2, 1);
            will-change: transform;
        }

        .card {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; gap: 25px;
            padding: 40px; min-width: 420px;
            background: rgba(120, 120, 120, 0.75); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 45px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            transition: transform 0.1s ease-out, left 0.6s ease, top 0.6s ease;
            transform-style: preserve-3d;
            left: 0; top: 0;
        }

        .profile-top { 
            display: flex; align-items: center; gap: 25px; 
            transform-style: preserve-3d; 
        }

        .ava-box { position: relative; transform-style: preserve-3d; }
        
        .avatar {
            width: 130px; height: 130px; border-radius: 35px;
            object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; position: relative; z-index: 2;
        }

        .ava-glow {
            position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%) translateZ(-1px);
            width: 80%; height: 30%; background: rgba(255, 255, 255, 0);
            filter: blur(20px); transition: all 0.4s ease;
            pointer-events: none;
        }

        .avatar:hover { 
            transform: translateY(-20px) scale(1.18) translateZ(15px); 
            border-color: #fff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        
        .avatar:hover + .ava-glow { 
            background: rgba(255, 255, 255, 0.8); 
            bottom: -15px; 
        }

        .nav-links { 
            display: flex; flex-direction: column; gap: 12px; 
            flex-grow: 1; transform-style: preserve-3d; 
        }

        .btn {
            text-decoration: none; color: #fff;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 14px; border-radius: 18px;
            font-size: 14px; font-weight: 900; 
            text-transform: uppercase; text-align: center;
            transition: all 0.2s ease; transform-style: preserve-3d;
        }

        .btn:hover { 
            background: rgba(255, 255, 255, 0.5); 
            transform: translateZ(25px);
        }

        .btn:active { 
            transform: translateZ(-35px) scale(0.85); 
            background: rgba(255, 255, 255, 0.2); 
        }

        .nick-container { margin-top: 20px; text-align: center; }
        
        .nickname {
            display: inline-block; font-size: 50px; font-weight: 900;
            letter-spacing: 15px; text-transform: uppercase;
            color: transparent; 
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.8);
            transform: none !important;
            transition: all 0.4s ease; cursor: default;
        }

        .nickname:hover {
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 1);
            text-shadow: 0 0 35px rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>

    <img src="bg.jpg" id="bg-parallax" alt="background">

    <div class="card" id="card">
        <div class="profile-top">
            <div class="ava-box">
                <img src="ava.jpg" alt="Avatar" class="avatar">
                <div class="ava-glow"></div>
            </div>
            <div class="nav-links">
                <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
                <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
            </div>
        </div>
        <div class="nick-container">
            <h1 class="nickname">DISSS</h1>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const bg = document.getElementById('bg-parallax');

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            
            card.style.transform = `rotateX(${y * -25}deg) rotateY(${x * 25}deg)`;
            
            // Reduced sensitivity for background
            bg.style.transform = `scale(1.1) translate(${x * -20}px, ${y * -20}px)`;
        });

        card.addEventListener('dblclick', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (x < rect.width / 3) card.style.left = "-150px";
            else if (x > (rect.width / 3) * 2) card.style.left = "150px";
            else card.style.left = "0";

            if (y < rect.height / 3) card.style.top = "-150px";
            else if (y > (rect.height / 3) * 2) card.style.top = "150px";
            else card.style.top = "0";
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            bg.style.transform = `scale(1.1) translate(0, 0)`;
        });
    </script>
</body>
</html>
