<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Pro Bio</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            perspective: 2000px;
            /* Global soft blur effect */
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        /* INFINITE BACKGROUND - FIXED FILENAME */
        .background {
            position: fixed;
            top: -20%; left: -20%;
            width: 140%; height: 140%;
            background-image: url('./bg.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            z-index: -2;
            filter: brightness(0.4);
            /* Smooth parallax transition */
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;
        }

        /* CARD (LIQUID GLASS) */
        .card {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 35px;
            min-width: 380px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            /* Constant light glow of the card itself */
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* AVATAR LIFT EFFECT */
        .avatar {
            width: 130px; height: 130px;
            border-radius: 35px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .avatar:hover {
            transform: translateY(-15px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
        }

        .nav-links {
            display: flex; flex-direction: column; gap: 12px; flex-grow: 1;
        }

        /* BUTTONS WITH LOCAL GLOW & LIFT */
        .btn {
            text-decoration: none; color: white;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px; border-radius: 16px;
            font-size: 14px; font-weight: 700;
            text-transform: uppercase; text-align: center;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-5px); /* Lift effect */
            border-color: rgba(255, 255, 255, 0.3);
            /* Glow ONLY under the button */
            box-shadow: 0 12px 25px rgba(255, 255, 255, 0.15);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .btn:active {
            transform: translateY(1px);
        }

        .nickname {
            margin: 0; text-align: center;
            font-size: 42px; font-weight: 900;
            letter-spacing: 8px; text-transform: uppercase;
            color: #fff;
            transition: all 0.5s ease;
            cursor: default;
        }
        .nickname:hover {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="background" id="bg"></div>

    <div class="card" id="card">
        <div class="profile-top">
            <img src="./ava.jpg" alt="Avatar" class="avatar">
            <div class="nav-links">
                <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
                <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
            </div>
        </div>
        <h1 class="nickname">DISSS</h1>
    </div>

    <script>
        const bg = document.getElementById('bg');
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;

            // Background movement (infinite feel)
            bg.style.transform = `translate(${x * 50}px, ${y * 50}px)`;

            // Card tilting
            card.style.transform = `rotateX(${y * -12}deg) rotateY(${x * 12}deg)`;
        });
    </script>
</body>
</html>
