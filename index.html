<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Bio</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; /* Deep black for safety */
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            perspective: 1500px;
        }

        /* FIXED BACKGROUND - NO MOVEMENT TO PREVENT BLACK STRIPES */
        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: url('./bg.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover; /* Forces image to fill entire screen */
            z-index: -2;
            filter: brightness(0.4) blur(2px); /* 2px blur integrated here */
        }

        /* DARKER CARD */
        .card {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 35px;
            min-width: 380px;
            background: rgba(0, 0, 0, 0.8); /* Solid dark glass */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .avatar {
            width: 130px; height: 130px;
            border-radius: 35px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .avatar:hover {
            transform: translateY(-10px) scale(1.05);
        }

        .nav-links {
            display: flex; flex-direction: column; gap: 12px; flex-grow: 1;
        }

        /* BUTTONS WITH LOCAL GLOW */
        .btn {
            text-decoration: none; color: white;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px; border-radius: 16px;
            font-size: 13px; font-weight: 700;
            text-transform: uppercase; text-align: center;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 8px #fff;
        }

        .nickname {
            margin: 0; text-align: center;
            font-size: 40px; font-weight: 900;
            letter-spacing: 10px; text-transform: uppercase;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="card" id="card">
        <div class="profile-top">
            <img src="./ava.jpg" alt="Avatar" class="avatar">
            <div class="nav-links">
                <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
                <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
            </div>
        </div>
        <h1 class="nickname">DISSS</h1>
    </div>

    <script>
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;

            // Only Tilt the card, don't touch the background
            card.style.transform = `rotateX(${y * -15}deg) rotateY(${x * 15}deg)`;
        });
    </script>
</body>
</html>
