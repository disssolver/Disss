<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio | Pro Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; perspective: 2500px;
        }

        #bg-parallax {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1; object-fit: cover;
            filter: brightness(0.45) blur(2px);
            transform: scale(1.1);
            transition: transform 0.8s cubic-bezier(0.2, 0, 0.2, 1);
            will-change: transform;
        }

        .panel-container {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            gap: 10px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, top 0.8s cubic-bezier(0.4, 0, 0.2, 1), left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-base {
            background: rgba(140, 140, 140, 0.75);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            width: 440px;
            box-shadow: none; /* Removed shadows as requested */
            transform-style: preserve-3d;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* CLOCK STYLE */
        .real-time-clock {
            position: absolute;
            top: 20px; 
            left: 50%;
            transform: translateX(-50%) translateZ(-10px);
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 5px;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }

        .card-main {
            position: relative; z-index: 20;
            padding: 35px; border-radius: 40px;
        }

        /* MINI ROUND BUTTON UNDER AVATAR */
        .mini-circle-btn {
            width: 20px; height: 20px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            margin: 12px auto 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .mini-circle-btn:hover { 
            background: #fff; 
            transform: scale(1.2); 
        }

        /* CLOCK REVEAL ANIMATION */
        .panel-container.show-clock .real-time-clock {
            top: -65px;
            opacity: 1;
        }
        .panel-container.show-clock .card-main {
            transform: rotateX(15deg); /* Tilt effect for clock visibility */
        }

        /* SECOND PANEL */
        .card-extra {
            position: absolute;
            top: 10%; z-index: 10;
            height: 140px;
            border-radius: 35px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 25px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-30px) scale(0.9) translateZ(-30px);
        }

        /* SECOND PANEL OPEN STATE */
        .panel-container.is-open .card-main {
            transform: translateY(-50px) rotateX(0deg); 
        }
        .panel-container.is-open .card-extra {
            position: relative;
            transform: translateY(0) scale(1) translateZ(0);
            opacity: 1;
            pointer-events: auto;
        }

        .profile-top { display: flex; align-items: center; gap: 25px; transform-style: preserve-3d; margin-bottom: 20px; }
        
        .avatar-container { display: flex; flex-direction: column; align-items: center; }
        .avatar {
            width: 115px; height: 115px; border-radius: 30px;
            object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s ease;
        }

        .btn {
            text-decoration: none; 
            color: rgba(0, 0, 0, 0.85);
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px; border-radius: 16px;
            font-size: 13px; font-weight: 900; 
            text-transform: uppercase; text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.8); }

        .social-icon {
            width: 85px; height: 85px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 25px;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none; color: black; font-weight: 900; font-size: 16px;
        }
        .social-icon:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <img src="bg.jpg" id="bg-parallax" alt="Background">

    <div class="panel-container" id="panel-container">
        
        <div class="real-time-clock" id="real-time-clock">00:00</div>

        <div class="glass-base card-main" id="card-main">
            <div class="profile-top">
                <div class="avatar-container">
                    <img src="ava.jpg" alt="Avatar" class="avatar">
                    <div class="mini-circle-btn" id="clock-trigger"></div>
                </div>
                <div class="nav-links" style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
                    <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
                    <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                    <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
                </div>
            </div>
            <div class="btn" id="toggle-more">More socials</div>
        </div>

        <div class="glass-base card-extra" id="card-extra">
            <a href="#" class="social-icon">INST</a>
            <a href="#" class="social-icon">TT</a>
            <a href="#" class="social-icon">SC</a>
            <a href="#" class="social-icon">CLUB</a>
        </div>
    </div>

    <script>
        const container = document.getElementById('panel-container');
        const bg = document.getElementById('bg-parallax');
        const toggleBtn = document.getElementById('toggle-more');
        const clockBtn = document.getElementById('clock-trigger');
        const clockElement = document.getElementById('real-time-clock');

        // Mouse movement parallax
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            container.style.transform = `rotateX(${y * -20}deg) rotateY(${x * 20}deg)`;
            bg.style.transform = `scale(1.1) translate(${x * -15}px, ${y * -15}px)`;
        });

        // Toggle social panel
        toggleBtn.addEventListener('click', () => {
            container.classList.toggle('is-open');
            toggleBtn.textContent = container.classList.contains('is-open') ? "Close" : "More socials";
        });

        // Toggle clock and tilt
        clockBtn.addEventListener('click', () => {
            container.classList.toggle('show-clock');
        });
        
        // Update real time clock
        function updateClock() {
            const now = new Date();
            const h = now.getHours().toString().padStart(2, '0');
            const m = now.getMinutes().toString().padStart(2, '0');
            clockElement.textContent = `${h}:${m}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Corner teleport only
        document.getElementById('card-main').addEventListener('click', (e) => {
            if (e.target.closest('.btn') || e.target.closest('.mini-circle-btn')) return;
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cornerSize = 85; 

            const isLeft = x < cornerSize;
            const isRight = x > rect.width - cornerSize;
            const isTop = y < cornerSize;
            const isBottom = y > rect.height - cornerSize;

            if ((isLeft || isRight) && (isTop || isBottom)) {
                container.style.left = (isLeft ? -150 : 150) + "px";
                container.style.top = (isTop ? -150 : 150) + "px";
            } else {
                container.style.left = "0px"; 
                container.style.top = "0px";
            }
        });
    </script>
</body>
</html>
