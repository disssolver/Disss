<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Bio</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            /* ПОЛНОСТЬЮ ЧЕРНЫЙ ФОН */
            background: #000000; 
            color: white;
            font-family: sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .card {
            /* Полупрозрачная карточка для эффекта глубины */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px; border-radius: 30px;
            text-align: center; width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,1);
        }

        .avatar {
            width: 130px; height: 130px;
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
            margin-bottom: 20px; object-fit: cover;
        }

        h1 { margin: 10px 0; font-size: 28px; letter-spacing: 3px; font-weight: bold; }

        .btn {
            display: block; text-decoration: none; color: white;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px; margin: 10px 0; border-radius: 12px;
            font-weight: bold; transition: 0.3s;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.02); }

        #playBtn {
            background: #fff; border: none; border-radius: 50%;
            width: 50px; height: 50px; cursor: pointer;
            font-size: 20px; margin-top: 20px;
            display: inline-flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="ava.jpg" class="avatar">
        <h1>DISSS</h1>
        <div class="links">
            <a href="https://t.me/jurabek1608" class="btn">TELEGRAM</a>
            <a href="https://discordapp.com/users/1035880231619280926" class="btn">DISCORD</a>
            <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">STEAM</a>
        </div>
        <button id="playBtn">▶</button>
        <audio id="audio" loop>
            <source src="music.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const btn = document.getElementById('playBtn');
        btn.onclick = () => {
            if (audio.paused) {
                audio.play();
                btn.innerText = '⏸';
            } else {
                audio.pause();
                btn.innerText = '▶';
            }
        };
    </script>
</body>
</html>
