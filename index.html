<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Profile</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #000; color: white;
            font-family: sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* НАСТРОЙКА ФОНА */
        .bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('bg.jpg') no-repeat center center; /* Имя твоего файла фона */
            background-size: cover; 
            z-index: -1; 
            filter: brightness(0.4); /* Затемнение, чтобы текст читался */
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px; border-radius: 30px;
            text-align: center; width: 280px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        .avatar {
            width: 130px; height: 130px;
            border-radius: 50%; border: 2px solid white;
            margin-bottom: 20px; object-fit: cover;
        }

        .btn {
            display: block; text-decoration: none; color: white;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px; margin: 10px 0; border-radius: 12px;
            font-weight: bold; transition: 0.3s;
            text-transform: uppercase;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.2); }

        #playBtn {
            background: white; border: none; border-radius: 50%;
            width: 50px; height: 50px; cursor: pointer;
            font-size: 20px; margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="card">
        <img src="ava.jpg" class="avatar">
        <h1>DISSS</h1>
        <div class="links">
            <a href="https://t.me/jurabek1608" class="btn">TELEGRAM</a>
            <a href="https://discordapp.com/users/1035880231619280926" class="btn">DISCORD</a>
            <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">STEAM</a>
        </div>
        <button id="playBtn">▶</button>
        <audio id="audio" loop>
            <source src="music.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const btn = document.getElementById('playBtn');
        btn.onclick = () => {
            if (audio.paused) {
                audio.play();
                btn.innerText = '⏸';
            } else {
                audio.pause();
                btn.innerText = '▶';
            }
        };
    </script>
</body>
</html>
