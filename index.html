<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Pro Bio</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            perspective: 2000px;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        /* INFINITE BACKGROUND - Stretch and center to remove black bars */
        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('./bg.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover; /* This makes it fill the screen completely */
            z-index: -2;
            filter: brightness(0.4);
            /* Tracking movement remains */
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;
        }

        /* CARD (DARKER, but with same frosted effect) */
        .card {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 35px;
            min-width: 380px;
            background: rgba(0, 0, 0, 0.6); /* DARKER background */
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.05); /* Lighter border for contrast */
            border-radius: 40px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.03); /* Subtle glow */
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* AVATAR - Keep it bright */
        .avatar {
            width: 130px; height: 130px;
            border-radius: 35px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .avatar:hover {
            transform: translateY(-15px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .nav-links {
            display: flex; flex-direction: column; gap: 12px; flex-grow: 1;
        }

        /* BUTTONS - Preserve brightness and local glow */
        .btn {
            text-decoration: none; color: white;
            background: rgba(255, 255, 255, 0.1); /* Brighter base */
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px; border-radius: 16px;
            font-size: 14px; font-weight: 700;
            text-transform: uppercase; text-align: center;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px); /* Lift effect */
            border-color: rgba(255, 255, 255, 0.4);
            /* Glow ONLY under the button */
            box-shadow: 0 12px 25px rgba(255, 255, 255, 0.15);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .btn:active {
            transform: translateY(1px);
        }

        /* TEXT - Keep it bright */
        .nickname {
            margin: 0; text-align: center;
            font-size: 42px; font-weight: 900;
            letter-spacing: 8px; text-transform: uppercase;
            color: #fff;
            transition: all 0.5s ease;
            cursor: default;
        }
        .nickname:hover {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
