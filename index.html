<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Disss | Bio</title>
    <style>
        /* Полный сброс всех отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            /* Flexbox по всему экрану */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            perspective: 1200px;
        }

        /* ФОН: Растягивается на весь экран без щелей */
        .bg-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            object-fit: cover; /* Заполняет всё пространство */
            filter: brightness(0.3) blur(2px); /* Твой блюр на месте */
            pointer-events: none;
        }

        /* ТЕМНАЯ ТАБЛИЧКА */
        .card {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            /* Темный фон, как ты просил */
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 30px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.4s ease;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        /* КНОПКИ: Английский текст, эффект выступа и свечение */
        .btn {
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px); /* Эффект выступа */
            border-color: rgba(255, 255, 255, 0.4);
            /* Свечение только под кнопкой */
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .nickname {
            margin-top: 15px;
            text-align: center;
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #fff;
            cursor: default;
        }
    </style>
</head>

            <div class="nav-links">

                <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
            </div>
        </div>
        <h1 class="nickname">DISSS</h1>
    </div>
