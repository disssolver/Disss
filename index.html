<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Interactive Bio</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        /* ФОН С ПАРАЛЛАКСОМ */
        .background {
            position: fixed;
            top: -5%; left: -5%;
            width: 110%; height: 110%;
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: brightness(0.4);
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        /* КАРТОЧКА (LIQUID GLASS + СВЕЧЕНИЕ СНИЗУ) */
        .card {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 35px;
            width: auto;
            min-width: 360px;
            
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px; /* Закругление как у таблички */
            
            /* МЯГКОЕ СИЯНИЕ СНИЗУ (вместо тени) */
            box-shadow: 0 15px 35px -5px rgba(255, 255, 255, 0.15);
            
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* АВАТАРКА С ТАКИМ ЖЕ ЗАКРУГЛЕНИЕМ */
        .avatar {
            width: 130px; height: 130px;
            border-radius: 35px; /* Синхронно с карточкой */
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .nav-links {
            display: flex; flex-direction: column; gap: 12px; flex-grow: 1;
        }

        /* КНОПКИ С ТЕНЬЮ И ЭФФЕКТОМ ПРОВАЛИВАНИЯ */
        .btn {
            text-decoration: none; color: white;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px; border-radius: 16px;
            font-size: 14px; font-weight: 700;
            text-transform: uppercase; text-align: center;
            transition: all 0.2s ease;
            
            /* Легкая тень под кнопками */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Наведение */
        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        /* ЭФФЕКТ ПРОВАЛИВАНИЯ (при нажатии) */
        .btn:active {
            transform: translateY(2px) scale(0.97); /* Проваливается и чуть сжимается */
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5); /* Внутренняя тень */
            background: rgba(255, 255, 255, 0.05);
        }

        .nickname {
            margin: 0; text-align: center;
            font-size: 42px; font-weight: 900;
            letter-spacing: 6px; text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div class="background" id="bg"></div>

    <div class="card" id="card">
        <div class="profile-top">
            <img src="ava.jpg" alt="Avatar" class="avatar">
            <div class="nav-links">
                <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
                <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
            </div>
        </div>
        <h1 class="nickname">DISSS</h1>
    </div>

    <script>
        const bg = document.getElementById('bg');
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            const moveX = (x - 0.5) * 20;
            const moveY = (y - 0.5) * 20;
            bg.style.transform = `translate(${moveX}px, ${moveY}px)`;

            const rotateX = (y - 0.5) * -10;
            const rotateY = (x - 0.5) * 10;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
    </script>

</body>
</html>
