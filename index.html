<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio | Side by Side UI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; perspective: 2000px;
        }

        #bg-parallax {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1; object-fit: cover;
            filter: brightness(0.35) blur(2px);
            transform: scale(1.1);
        }

        .panel-container {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .glass-base {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(40px) saturate(160%);
            -webkit-backdrop-filter: blur(40px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card-main { position: relative; z-index: 100; width: 480px; padding: 35px; border-radius: 45px; }

        /* SIDE PANELS */
        .side-panel {
            position: absolute; top: 0; z-index: 50;
            height: 100%; width: 340px; border-radius: 40px;
            padding: 30px; opacity: 0; pointer-events: none;
            display: flex; flex-direction: column;
        }
        .card-pc { right: 0; transform: translateX(0); }
        .panel-container.pc-open .card-pc { transform: translateX(390px); opacity: 1; pointer-events: auto; }

        .card-music { left: 0; transform: translateX(0); }
        .panel-container.music-open .card-music { transform: translateX(-390px); opacity: 1; pointer-events: auto; }

        /* BUTTON STYLE (SAME AS YOUR LONG BUTTONS) */
        .btn {
            color: rgba(255,255,255,0.9);
            background: rgba(255, 255, 255, 0.06); 
            padding: 14px; 
            border-radius: 20px;
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase;
            text-align: center; 
            cursor: pointer; 
            display: block; 
            width: 100%;
            margin-bottom: 12px; 
            border: 1px solid rgba(255,255,255,0.1); 
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); }
        .btn.active { background: rgba(255, 255, 255, 0.2) !important; border-color: rgba(255, 255, 255, 0.5); }

        /* THE ROW FOR SIDE-BY-SIDE BUTTONS */
        .square-row {
            display: flex;
            gap: 10px;
            width: 130px; /* Matches avatar width approx */
            justify-content: center;
        }

        /* SHORTENED BUTTONS */
        .btn-short {
            margin-bottom: 0;
            padding: 14px 0;
            flex: 1; /* Makes them equal width */
            font-size: 10px;
        }

        .avatar { 
            width: 130px; height: 130px; 
            border-radius: 35px; 
            border: 1px solid rgba(255,255,255,0.2); 
            margin-bottom: 15px;
            object-fit: cover;
        }

        .profile-top { display: flex; align-items: flex-start; gap: 25px; margin-bottom: 20px; }
        .nav-links { display: flex; flex-direction: column; flex-grow: 1; padding-top: 5px; }

        .real-time-clock { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            font-size: 42px; font-weight: 900; letter-spacing: 5px; 
            opacity: 0; transition: 0.6s; color: #fff; 
        }
        .panel-container.show-clock .real-time-clock { top: -80px; opacity: 1; }

        .specs-title { font-size: 16px; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .item-list { list-style: none; }
        .item-list li { font-size: 13px; font-weight: 600; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .item-list a { text-decoration: none; color: rgba(255,255,255,0.5); transition: 0.3s; }
        .item-list a:hover { color: #fff; }
    </style>
</head>
<body>

    <img src="bg.jpg" id="bg-parallax">

    <div class="panel-container" id="panel-container">
        
        <div class="real-time-clock" id="real-time-clock">00:00</div>

        <div class="glass-base side-panel card-music">
            <h2 class="specs-title">Top Songs</h2>
            <div style="overflow-y: auto; flex-grow: 1;">
                <ul class="item-list">
                    <li><a href="https://soundcloud.com/..." target="_blank">Vh5-playlisted</a></li>
                    <li><a href="https://soundcloud.com/..." target="_blank">s0rrow - fake ur face</a></li>
                    <li><a href="https://soundcloud.com/..." target="_blank">s0rrow - unhappy</a></li>
                    <li><a href="https://soundcloud.com/..." target="_blank">s0rrow - im not alright</a></li>
                    <li><a href="https://soundcloud.com/..." target="_blank">s0rrow - stalk ur socials</a></li>
                </ul>
            </div>
        </div>

        <div class="glass-base card-main">
            <div class="profile-top">
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <img src="ava.jpg" class="avatar">
                    
                    <div class="square-row">
                        <div class="btn btn-short" id="music-trigger">Music</div>
                        <div class="btn btn-short" id="clock-trigger">Time</div>
                    </div>
                </div>
                
                <div class="nav-links">
                    <div class="btn">Telegram</div>
                    <div class="btn">Discord</div>
                    <div class="btn">Steam</div>
                    <div class="btn" id="pc-trigger">My PC</div>
                </div>
            </div>
            <button class="btn" style="margin-bottom: 0;">More socials</button>
        </div>

        <div class="glass-base side-panel card-pc">
            <h2 class="specs-title">My Config</h2>
            <ul class="item-list">
                <li>i5-13400</li>
                <li>RTX 3060ti</li>
                <li>16gb RAM</li>
            </ul>
        </div>
    </div>

    <script>
        const container = document.getElementById('panel-container');
        const bg = document.getElementById('bg-parallax');
        const clockBtn = document.getElementById('clock-trigger');
        const musicBtn = document.getElementById('music-trigger');
        const pcBtn = document.getElementById('pc-trigger');
        const clockElement = document.getElementById('real-time-clock');

        clockBtn.onclick = () => { container.classList.toggle('show-clock'); clockBtn.classList.toggle('active'); };
        musicBtn.onclick = () => { container.classList.toggle('music-open'); musicBtn.classList.toggle('active'); };
        pcBtn.onclick = () => { container.classList.toggle('pc-open'); pcBtn.classList.toggle('active'); };

        document.onmousemove = (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            bg.style.transform = `scale(1.1) translate(${x * -20}px, ${y * -20}px)`;
        };
        
        function updateClock() {
            const now = new Date();
            clockElement.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateClock, 1000); updateClock();
    </script>
</body>
</html>
