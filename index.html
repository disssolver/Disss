<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Pro Bio</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            perspective: 2000px;
            /* Легкий блюр всей страницы 1-3% */
            backdrop-filter: blur(2px);
        }

        /* ИСПРАВЛЕННЫЙ ФОН БЕЗ ПОЛОС */
        .background {
            position: fixed;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: brightness(0.4);
            /* Ультра-плавность хода */
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        /* КАРТОЧКА */
        .card {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 35px;
            min-width: 380px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 40px;
            
            /* СИЯНИЕ СНИЗУ (базовое) */
            box-shadow: 0 15px 35px -5px rgba(255, 255, 255, 0.1);
            
            /* Плавный наклон */
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.5s ease;
            will-change: transform, box-shadow;
        }

        /* УСИЛЕНИЕ СИЯНИЯ ПРИ НАВЕДЕНИИ НА КНОПКИ */
        .card:has(.btn:hover) {
            box-shadow: 0 20px 50px -5px rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* АВАТАРКА С ЭФФЕКТОМ ПОДНЯТИЯ */
        .avatar {
            width: 130px; height: 130px;
            border-radius: 35px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .avatar:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .nav-links {
            display: flex; flex-direction: column; gap: 12px; flex-grow: 1;
        }

        /* КНОПКИ С СИЯНИЕМ ТЕКСТА */
        .btn {
            text-decoration: none; color: white;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px; border-radius: 16px;
            font-size: 14px; font-weight: 700;
            text-transform: uppercase; text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            /* Сияние текста */
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn:active {
            transform: translateY(2px) scale(0.97);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* НИК С СИЯНИЕМ ПРИ НАВЕДЕНИИ */
        .nickname {
            margin: 0; text-align: center;
            font-size: 42px; font-weight: 900;
            letter-spacing: 6px; text-transform: uppercase;
            color: #fff;
            transition: all 0.5s ease;
            cursor: default;
