<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Core</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        body, html {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            /* perspective defines 3D depth of the whole screen */
            perspective: 1500px; 
            backdrop-filter: blur(2px);
        }

        /* BACKGROUND - Covers entire screen without black lines */
        #bg-fullscreen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            object-fit: cover;
            filter: brightness(0.35) blur(2px);
            pointer-events: none;
        }

        /* CARD (THE BASE CONTAINER) */
        .card {
            position: relative;
            z-index: 10;
            display: flex; flex-direction: column; gap: 20px;
            padding: 35px; min-width: 380px; max-width: 400px;
            /* DARKEST TABLE BACKGROUND */
            background: rgba(10, 10, 10, 0.95); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            /* Deep static shadow */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            
            /* DYNAMIC UNDERGLOW - changes position based on tilt */
            transition: transform 0.1s ease-out, top 0.6s ease-in-out, left 0.6s ease-in-out, filter 0.6s ease-in-out;
            will-change: transform, top, left, filter;
            
            /* internal items also need to allow 3D depth */
            transform-style: preserve-3d;
            
            cursor: pointer; /* To indicate double-click teleport is active */
        }
        
        /* THE DYNAMIC UNDERGLOW EFFECT LAYER */
        .card-glow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 40px;
            z-index: -5;
            /* Light source beneath the card - positioned and amplified by JS */
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
            filter: blur(30px);
            opacity: 0.1;
            transition: all 0.15s ease-out;
            pointer-events: none;
        }

        .profile-top {
            display: flex; align-items: center; gap: 20px;
            transform-style: preserve-3d;
        }

        /* AVATAR WITH ITS OWN TILT */
        .avatar {
            width: 100px; height: 100px;
            border-radius: 25px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
            
            /* Smooth lift transitions and independent tilt handled by JS */
            transition: all 0.3s ease;
            cursor: default;
        }
        .avatar:hover {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .nav-links {
            display: flex; flex-direction: column; gap: 10px; flex-grow: 1;
            transform-style: preserve-3d;
        }

        /* BUTTONS: Independent tilt, lift, local glow */
        .btn {
            display: block; width: 100%;
            text-decoration: none; color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px; border-radius: 15px;
            font-size: 13px; font-weight: 700;
            text-transform: uppercase; text-align: center;
            
            /* Independent tilt handled by JS */
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            z-index: 10;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            
            /* LOCAL GLOW - text glow is handled here */
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        /* TRANSPARENT NICKNAME DISSS WITH RAYS */
        .nickname-container {
            margin-top: 10px;
            text-align: center;
            position: relative;
            transform-style: preserve-3d;
            
            /* Text itself does not tilt (as requested) */
            perspective: 1000px; 
            cursor: default;
        }
        
        .nickname {
            display: inline-block;
            margin: 0;
            font-size: 40px; font-weight: 900;
            letter-spacing: 12px; text-transform: uppercase;
            
            /* THE KEY: Make the text transparent with an outline */
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.4); 
            text-shadow: none;
            
            transition: all 0.4s ease;
            position: relative;
            z-index: 20;
        }
        
        /* THE RAYS EFFECT - a hidden layer behind the text */
        .nickname-rays {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.0) 70%);
            filter: blur(15px);
            z-index: 10;
            opacity: 0; /* Hidden initially */
            transition: opacity 0.3s ease-out;
            pointer-events: none;
        }

        .nickname:hover {
            /* On hover, amplify the outline slightly and activate text shadow */
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }
        
        .nickname:hover ~ .nickname-rays {
            /* On hover, activate the background rays */
            opacity: 1;
        }
    </style>
