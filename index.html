<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Elite Dual Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; perspective: 2500px;
        }

        #bg-parallax {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1; object-fit: cover;
            filter: brightness(0.45) blur(2px);
            transform: scale(1.1);
            transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1);
            will-change: transform;
        }

        .panel-container {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; /* Closer panels */
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, top 0.8s cubic-bezier(0.4, 0, 0.2, 1), left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-base {
            background: rgba(140, 140, 140, 0.75);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            /* Super smooth animation curve */
            transition: all 0.9s cubic-bezier(0.34, 1.3, 0.64, 1);
        }

        /* HIDDEN REAL-TIME CLOCK (direct child of body, not container) */
        .real-time-clock {
            position: absolute;
            top: 25px; left: 50%;
            transform: translateX(-50%) translateY(20px) translateZ(-5px);
            font-size: 24px; font-weight: 900;
            color: rgba(255, 255, 255, 0); /* Hidden */
            letter-spacing: 3px;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 5;
            pointer-events: none;
        }
        
        /* Inner shadow that hides the clock initially (cast by top edge of first card) */
        .real-time-clock::after {
            content: '';
            position: absolute; top: -100px; left: -100px;
            width: calc(100% + 200px); height: calc(100% + 200px);
            background: transparent;
            box-shadow: inset 0 -40px 30px rgba(0, 0, 0, 0.8); /* Shadow from card */
            pointer-events: none;
            transition: all 0.6s ease;
        }

        /* MAIN CARD - No glowing classes needed */
        .card-main {
            position: relative; z-index: 20;
            padding: 35px; border-radius: 40px;
        }
        
        /* Reveal clock and remove shadow when main card is hovered */
        .panel-container:hover .real-time-clock {
            color: rgba(255, 255, 255, 1);
            transform: translateX(-50%) translateY(0) translateZ(0px);
        }
        .panel-container:hover .real-time-clock::after {
             box-shadow: inset 0 -100px 30px transparent; /* No shadow when clock rises */
        }

        .card-extra {
            position: absolute;
            top: 20%; z-index: 10;
            height: 140px; /* Slightly taller for bigger icons */
            border-radius: 35px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 25px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px) scale(0.95) translateZ(-20px);
        }

        /* OPEN STATE */
        .panel-container.is-open .card-main {
            transform: translateY(-40px);
        }

        .panel-container.is-open .card-extra {
            position: relative;
            transform: translateY(0) scale(1) translateZ(0);
            opacity: 1;
            pointer-events: auto;
        }

        .profile-top { display: flex; align-items: center; gap: 25px; transform-style: preserve-3d; margin-bottom: 20px; }
        
        .ava-box { position: relative; transform-style: preserve-3d; }
        .avatar {
            width: 110px; height: 110px; border-radius: 30px;
            object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; position: relative; z-index: 2;
        }
        .ava-glow {
            position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%) translateZ(-1px);
            width: 80%; height: 30%; background: rgba(255, 255, 255, 0);
            filter: blur(20px); transition: 0.4s ease;
        }
        .avatar:hover { transform: translateY(-15px) scale(1.15) translateZ(20px); }
        .avatar:hover + .ava-glow { background: rgba(255, 255, 255, 0.8); bottom: -10px; }

        .nav-links { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; transform-style: preserve-3d; }

        .btn {
            text-decoration: none; 
            color: rgba(0, 0, 0, 0.85);
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px; border-radius: 15px;
            font-size: 13px; font-weight: 900; 
            text-transform: uppercase; text-align: center;
            transition: all 0.2s ease; transform-style: preserve-3d;
            cursor: pointer;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.6); transform: translateZ(25px); }
        .btn:active { transform: translateZ(-30px) scale(0.85); }

        /* BIGGER SOCIAL ICONS */
        .social-icon {
            width: 80px; height: 80px; /* Made bigger as requested */
            background: rgba(255, 255, 255, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none; color: black; font-weight: 900; font-size: 14px; /* Text scaled too */
        }
        .social-icon:hover {
            background: rgba(255, 255, 255, 0.65);
            transform: translateY(-10px) scale(1.1) translateZ(15px);
            border-color: #fff;
        }
    </style>
</head>
<body>

    <img src="bg.jpg" id="bg-parallax" alt="background">

    <div class="panel-container" id="panel-container">
        
        <div class="real-time-clock" id="real-time-clock">12:00</div>

        <div class="glass-base card-main" id="card-main">
            <div class="profile-top">
                <div class="ava-box">
                    <img src="ava.jpg" alt="Avatar" class="avatar">
                    <div class="ava-glow"></div>
                </div>
                <div class="nav-links">
                    <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
                    <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                    <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
                </div>
            </div>
            <div class="btn" id="toggle-more">More socials</div>
        </div>

        <div class="glass-base card-extra" id="card-extra">
            <a href="#" class="social-icon">INST</a>
            <a href="#" class="social-icon">TT</a>
            <a href="#" class="social-icon">SC</a>
            <a href="#" class="social-icon">CLUB</a>
        </div>
    </div>

    <script>
        const container = document.getElementById('panel-container');
        const bg = document.getElementById('bg-parallax');
        const toggleBtn = document.getElementById('toggle-more');
        const clockElement = document.getElementById('real-time-clock');

        // MOUSE TRACKING
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            container.style.transform = `rotateX(${y * -20}deg) rotateY(${x * 20}deg)`;
            bg.style.transform = `scale(1.1) translate(${x * -15}px, ${y * -15}px)`;
        });

        // ANIMATION (Glow and sequence removed as requested)
        toggleBtn.addEventListener('click', () => {
            if (!container.classList.contains('is-open')) {
                // Direct open, no glow sequence
                container.classList.add('is-open');
                toggleBtn.textContent = "Close";
            } else {
                container.classList.remove('is-open');
                toggleBtn.textContent = "More socials";
            }
        });
        
        // --- REAL TIME CLOCK LOGIC ---
        
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            
            // Format 12:00
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            clockElement.textContent = hours + ':' + minutes;
        }
        
        // Initial call and set interval for every second
        updateClock();
        setInterval(updateClock, 1000);

        // CORNER TELEPORT (shadow logic remains static)
        document.getElementById('card-main').addEventListener('click', (e) => {
            if (e.target.closest('.btn')) return;
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cz = 100;

            if (x < cz && y < cz) { container.style.left = "-150px"; container.style.top = "-150px"; }
            else if (x > rect.width-cz && y < cz) { container.style.left = "150px"; container.style.top = "-150px"; }
            else if (x < cz && y > rect.height-cz) { container.style.left = "-150px"; container.style.top = "150px"; }
            else if (x > rect.width-cz && y > rect.height-cz) { container.style.left = "150px"; container.style.top = "150px"; }
            else { container.style.left = "0"; container.style.top = "0"; }
        });

        document.addEventListener('mouseleave', () => {
            container.style.transform = `rotateX(0deg) rotateY(0deg)`;
            bg.style.transform = `scale(1.1) translate(0, 0)`;
        });
    </script>
</body>
</html>
