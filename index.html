<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio | Glassmorphism Depth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; perspective: 2000px;
        }

        #bg-parallax {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1; object-fit: cover;
            filter: brightness(0.5) blur(2px);
            transform: scale(1.1);
        }

        .panel-container {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            transition: transform 0.1s ease-out, top 0.8s cubic-bezier(0.4, 0, 0.2, 1), left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* GLASS EFFECT FOR BOTH CARDS */
        .glass-base {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 440px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .real-time-clock {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            font-size: 32px; font-weight: 900;
            color: #fff; letter-spacing: 5px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1; opacity: 0;
            pointer-events: none;
        }

        .card-main {
            position: relative;
            z-index: 100; 
            padding: 35px; border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        /* CIRCLE BTN WITH BLUR */
        .mini-circle-btn {
            width: 22px; height: 22px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            margin: 12px auto 4px; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }

        .mini-circle-btn.active {
            background: #fff;
            transform: translateY(3px);
            box-shadow: 0 0px 0 transparent, 0 0 15px rgba(255,255,255,0.5);
        }

        /* GLASS BUTTONS (TABLE 1) */
        .btn {
            text-decoration: none; color: #fff;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px; border-radius: 16px;
            font-size: 13px; font-weight: 900; 
            text-transform: uppercase; text-align: center;
            transition: all 0.3s ease; cursor: pointer;
            display: block; width: 100%;
            position: relative; z-index: 200;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
        }

        .btn.active {
            background: rgba(255, 255, 255, 0.3) !important;
            transform: translateY(4px);
            box-shadow: 0 0px 0 transparent, 0 0 20px rgba(255,255,255,0.2);
        }

        /* SOCIAL PANEL (TABLE 2) */
        .card-extra {
            position: absolute;
            bottom: 0; left: 0;
            z-index: 10;
            height: 140px; border-radius: 35px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 25px; opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* SOCIAL ICONS WITH LIFT AND GLOW */
        .social-icon {
            width: 85px; height: 85px; 
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px; display: flex; justify-content: center; align-items: center;
            text-decoration: none; color: white; font-weight: 900;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Lift effect for Table 2 buttons */
        .social-icon:active, .social-icon.clicked {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.3); /* Glow effect */
            border-color: rgba(255, 255, 255, 0.5);
        }

        .panel-container.show-clock .real-time-clock { top: -70px; opacity: 1; }
        .panel-container.is-open .card-extra { bottom: -150px; opacity: 1; pointer-events: auto; }

        .clock-label { font-size: 10px; font-weight: 900; text-transform: uppercase; color: rgba(255,255,255,0.7); }
        .profile-top { display: flex; align-items: center; gap: 25px; margin-bottom: 20px; }
        .avatar { width: 115px; height: 115px; border-radius: 30px; object-fit: cover; border: 2px solid rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <img src="bg.jpg" id="bg-parallax" alt="Background">

    <div class="panel-container" id="panel-container">
        
        <div class="real-time-clock" id="real-time-clock">00:00</div>

        <div class="glass-base card-main" id="card-main">
            <div class="profile-top">
                <div class="avatar-container" style="display: flex; flex-direction: column; align-items: center;">
                    <img src="ava.jpg" alt="Avatar" class="avatar">
                    <div class="mini-circle-btn" id="clock-trigger"></div>
                    <div class="clock-label">Clock</div>
                </div>
                <div class="nav-links" style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
                    <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
                    <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                    <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
                </div>
            </div>
            <button class="btn" id="toggle-more">More socials</button>
        </div>

        <div class="glass-base card-extra" id="card-extra">
            <a href="#" class="social-icon">INST</a>
            <a href="#" class="social-icon">TT</a>
            <a href="#" class="social-icon">SC</a>
            <a href="#" class="social-icon">CLUB</a>
        </div>
    </div>

    <script>
        const container = document.getElementById('panel-container');
        const bg = document.getElementById('bg-parallax');
        const toggleBtn = document.getElementById('toggle-more');
        const clockBtn = document.getElementById('clock-trigger');
        const clockElement = document.getElementById('real-time-clock');

        toggleBtn.addEventListener('click', () => {
            container.classList.toggle('is-open');
            toggleBtn.classList.toggle('active');
            toggleBtn.textContent = container.classList.contains('is-open') ? "Close" : "More socials";
        });

        clockBtn.addEventListener('click', () => {
            container.classList.toggle('show-clock');
            clockBtn.classList.toggle('active');
        });

        // Add visual feedback for social icons
        document.querySelectorAll('.social-icon').forEach(icon => {
            icon.addEventListener('click', (e) => {
                e.preventDefault();
                icon.classList.add('clicked');
                setTimeout(() => icon.classList.remove('clicked'), 300);
            });
        });

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            bg.style.transform = `scale(1.1) translate(${x * -15}px, ${y * -15}px)`;
        });
        
        function updateClock() {
            const now = new Date();
            clockElement.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        updateClock();
        setInterval(updateClock, 1000);

        document.getElementById('card-main').addEventListener('click', (e) => {
            if (e.target.closest('.btn') || e.target.closest('#clock-trigger')) return;
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cs = 85; 
            if ((x < cs || x > rect.width - cs) && (y < cs || y > rect.height - cs)) {
                container.style.left = (x < cs ? -150 : 150) + "px";
                container.style.top = (y < cs ? -150 : 150) + "px";
            } else {
                container.style.left = "0px"; container.style.top = "0px";
            }
        });
    </script>
</body>
</html>
