<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio | Pro Elite 3D Fix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; perspective: 2500px;
        }

        #bg-parallax {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1; object-fit: cover;
            filter: brightness(0.4) blur(2px);
            transform: scale(1.1);
            transition: transform 0.8s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .panel-container {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, top 0.8s cubic-bezier(0.4, 0, 0.2, 1), left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-base {
            background: rgba(140, 140, 140, 0.75);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            width: 440px;
            transform-style: preserve-3d;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* CLOCK PANEL (TOP) */
        .real-time-clock {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%) translateZ(-30px);
            font-size: 32px; font-weight: 900;
            color: #fff; letter-spacing: 5px;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1; opacity: 0;
            pointer-events: none;
        }

        /* MAIN CARD */
        .card-main {
            position: relative;
            z-index: 100; 
            padding: 35px; border-radius: 40px;
            box-shadow: none;
        }

        /* CLOCK TRIGGER UI */
        .avatar-container { 
            display: flex; flex-direction: column; align-items: center; 
            cursor: pointer; z-index: 110;
        }
        .mini-circle-btn {
            width: 22px; height: 22px;
            background: #fff; border: 2px solid #fff;
            border-radius: 50%; margin: 12px auto 4px;
            transition: 0.4s ease;
        }
        .clock-label {
            font-size: 10px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* SOCIAL PANEL (BOTTOM) - BEHIND MAIN */
        .card-extra {
            position: absolute;
            bottom: 10px; z-index: 10;
            height: 140px; border-radius: 35px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 25px; opacity: 0;
            pointer-events: none;
            transform: translateZ(-30px);
        }

        /* ANIMATION STATES */
        .panel-container.show-clock .real-time-clock { top: -75px; opacity: 1; }
        .panel-container.show-clock .card-main { transform: rotateX(15deg); }
        .panel-container.show-clock .mini-circle-btn { background: #000; }

        .panel-container.is-open .card-extra { bottom: -155px; opacity: 1; pointer-events: auto; }
        .panel-container.is-open .card-main { transform: rotateX(-15deg); }

        /* BUTTONS */
        .btn {
            text-decoration: none; color: #000;
            background: #fff; border: none;
            padding: 12px; border-radius: 16px;
            font-size: 13px; font-weight: 900; 
            text-transform: uppercase; text-align: center;
            transition: 0.4s ease; cursor: pointer;
            display: block; width: 100%;
            position: relative; z-index: 200; /* Highest priority for clicking */
        }

        .panel-container.is-open #toggle-more {
            background: #000; color: #fff;
            border: 1px solid #555;
        }

        .profile-top { display: flex; align-items: center; gap: 25px; margin-bottom: 20px; }
        .avatar { width: 115px; height: 115px; border-radius: 30px; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.6); }

        .social-icon {
            width: 85px; height: 85px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 25px;
            display: flex; justify-content: center; align-items: center;
            text-decoration: none; color: black; font-weight: 900;
            transition: 0.3s ease;
        }
        .social-icon:hover { background: #fff; transform: scale(1.1); }
    </style>
</head>
<body>

    <img src="bg.jpg" id="bg-parallax" alt="Background">

    <div class="panel-container" id="panel-container">
        
        <div class="real-time-clock" id="real-time-clock">00:00</div>

        <div class="glass-base card-main" id="card-main">
            <div class="profile-top">
                <div class="avatar-container" id="clock-trigger">
                    <img src="ava.jpg" alt="Avatar" class="avatar">
                    <div class="mini-circle-btn"></div>
                    <div class="clock-label">Clock</div>
                </div>
                <div class="nav-links" style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
                    <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
                    <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                    <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
                </div>
            </div>
            <button class="btn" id="toggle-more">More socials</button>
        </div>

        <div class="glass-base card-extra" id="card-extra">
            <a href="#" class="social-icon">INST</a>
            <a href="#" class="social-icon">TT</a>
            <a href="#" class="social-icon">SC</a>
            <a href="#" class="social-icon">CLUB</a>
        </div>
    </div>

    <script>
        const container = document.getElementById('panel-container');
        const bg = document.getElementById('bg-parallax');
        const toggleBtn = document.getElementById('toggle-more');
        const clockBtn = document.getElementById('clock-trigger');
        const clockElement = document.getElementById('real-time-clock');

        // 3D Mouse Parallax
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            container.style.transform = `rotateX(${y * -15}deg) rotateY(${x * 15}deg)`;
            bg.style.transform = `scale(1.1) translate(${x * -15}px, ${y * -15}px)`;
        });

        // Fixed Toggle Logic
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            container.classList.toggle('is-open');
            toggleBtn.textContent = container.classList.contains('is-open') ? "Close" : "More socials";
        });

        // Clock Toggle
        clockBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            container.classList.toggle('show-clock');
        });
        
        // Time Update
        function updateClock() {
            const now = new Date();
            clockElement.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Corner Teleport
        document.getElementById('card-main').addEventListener('click', (e) => {
            if (e.target.closest('.btn') || e.target.closest('#clock-trigger')) return;
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cs = 85; 
            if ((x < cs || x > rect.width - cs) && (y < cs || y > rect.height - cs)) {
                container.style.left = (x < cs ? -150 : 150) + "px";
                container.style.top = (y < cs ? -150 : 150) + "px";
            } else {
                container.style.left = "0px"; container.style.top = "0px";
            }
        });
    </script>
</body>
</html>
