<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Profile</title>
    <style>
        /* Общие настройки */
        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* ЗАДНИЙ ФОН JPG */
        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: brightness(0.5); /* Немного приглушим фон, чтобы текст читался */
        }

        /* КАРТОЧКА С ГИБКИМИ РАЗМЕРАМИ (FLEX) */
        .card {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 30px;
            
            /* Регулировка размера по контенту */
            width: auto;
            min-width: 350px;
            max-width: 90vw;

            /* ЭФФЕКТ ЖИДКОГО СТЕКЛА */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* ВЕРХНЯЯ ЧАСТЬ: Аватар слева, Кнопки справа */
        .profile-top {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* АВАТАРКА */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0; /* Чтобы фото не сжималось */
        }

        /* КНОПКИ */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .btn {
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            text-align: center;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* НИК ПО ЦЕНТРУ СНИЗУ */
        .nickname {
            margin: 0;
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="card">
        <div class="profile-top">
            <img src="ava.jpg" alt="Avatar" class="avatar">
            
            <div class="nav-links">
                <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
                <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
            </div>
        </div>

        <h1 class="nickname">DISSS</h1>
    </div>

</body>
</html>
