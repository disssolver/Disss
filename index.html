<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio | Custom UI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; perspective: 2000px;
        }

        #bg-parallax {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1; object-fit: cover;
            filter: brightness(0.35) blur(2px);
            transform: scale(1.1);
        }

        .panel-container {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .glass-base {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(40px) saturate(160%);
            -webkit-backdrop-filter: blur(40px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card-main { position: relative; z-index: 100; width: 480px; padding: 35px; border-radius: 45px; }

        /* ВЕРХНЯЯ ТАБЛИЧКА ЧАСОВ */
        .card-top-clock {
            position: absolute; top: 0; left: 50%;
            transform: translate(-50%, 0);
            width: 400px; height: 100px;
            border-radius: 30px;
            z-index: 10; opacity: 0; pointer-events: none;
            display: flex; justify-content: space-around; align-items: center;
            padding: 15px;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .panel-container.clock-open .card-top-clock { transform: translate(-50%, -120px); opacity: 1; pointer-events: auto; }

        .time-box { text-align: center; }
        .time-label { font-size: 8px; text-transform: uppercase; opacity: 0.5; letter-spacing: 1px; margin-bottom: 2px; }
        .time-val { font-size: 18px; font-weight: 800; }
        .time-main { font-size: 32px; font-weight: 900; color: #fff; }

        /* БОКОВИНЫ (НЕ ТРОГАЕМ) */
        .side-panel {
            position: absolute; top: 0; z-index: 50;
            height: 100%; width: 340px; border-radius: 40px;
            padding: 30px; opacity: 0; pointer-events: none;
            display: flex; flex-direction: column;
        }
        .card-music { left: 0; }
        .panel-container.music-open .card-music { transform: translateX(-390px); opacity: 1; pointer-events: auto; }
        .card-pc { right: 0; }
        .panel-container.pc-open .card-pc { transform: translateX(390px); opacity: 1; pointer-events: auto; }

        /* НИЖНЯЯ ПАНЕЛЬ СОЦСЕТЕЙ */
        .card-extra {
            position: absolute; bottom: 0; left: 0; z-index: 10;
            height: 120px; border-radius: 40px; width: 100%;
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 25px; opacity: 0; pointer-events: none;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .panel-container.social-open .card-extra { transform: translateY(140px); opacity: 1; pointer-events: auto; }

        /* КНОПКИ */
        .btn {
            color: rgba(255,255,255,0.9);
            background: rgba(255, 255, 255, 0.06); 
            padding: 14px; border-radius: 20px;
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            text-align: center; cursor: pointer; display: block; width: 100%;
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); 
            transition: 0.3s; text-decoration: none;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.12); }
        .btn.active { background: rgba(255, 255, 255, 0.2) !important; border-color: #fff; }

        .square-row { display: flex; gap: 10px; width: 130px; margin-top: 15px; }
        .btn-short { margin-bottom: 0; padding: 14px 0; flex: 1; font-size: 10px; }

        .avatar { width: 130px; height: 130px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.2); object-fit: cover; }
        .profile-top { display: flex; align-items: flex-start; gap: 25px; margin-bottom: 20px; }
        .nav-links { display: flex; flex-direction: column; flex-grow: 1; padding-top: 5px; }

        .social-icon {
            width: 80px; height: 80px; background: rgba(255, 255, 255, 0.08);
            border-radius: 25px; display: flex; justify-content: center; align-items: center; 
            color: white; font-weight: 900; cursor: pointer; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1);
        }
        .social-icon:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.15); }
        
        .specs-title { font-size: 16px; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .item-list { list-style: none; }
        .item-list li { font-size: 13px; font-weight: 600; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); }
    </style>
</head>
<body>

    <img src="bg.jpg" id="bg-parallax">

    <div class="panel-container" id="panel-container">
        
        <div class="glass-base card-top-clock">
            <div class="time-box">
                <div class="time-label">USA</div>
                <div class="time-val" id="time-usa">00:00</div>
            </div>
            <div class="time-box">
                <div class="time-label">Local Time</div>
                <div class="time-main" id="time-local">00:00</div>
            </div>
            <div class="time-box">
                <div class="time-label">Japan</div>
                <div class="time-val" id="time-japan">00:00</div>
            </div>
        </div>

        <div class="glass-base side-panel card-music">
            <h2 class="specs-title">Music</h2>
            <ul class="item-list">
                <li>Song 1 - Artist</li>
                <li>Song 2 - Artist</li>
                <li>Song 3 - Artist</li>
            </ul>
        </div>

        <div class="glass-base card-main">
            <div class="profile-top">
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <img src="ava.jpg" class="avatar">
                    <div class="square-row">
                        <div class="btn btn-short" id="music-trigger">Music</div>
                        <div class="btn btn-short" id="clock-trigger">Time</div>
                    </div>
                </div>
                
                <div class="nav-links">
                    <div class="btn">Telegram</div>
                    <div class="btn">Discord</div>
                    <div class="btn">Steam</div>
                    <div class="btn" id="pc-trigger">My PC</div>
                </div>
            </div>
            <div class="btn" id="toggle-more" style="margin-bottom: 0;">More socials</div>
        </div>

        <div class="glass-base side-panel card-pc">
            <h2 class="specs-title">My PC</h2>
            <ul class="item-list">
                <li>CPU: i5-13400</li>
                <li>GPU: RTX 3060ti</li>
                <li>RAM: 16gb</li>
            </ul>
        </div>

        <div class="glass-base card-extra">
            <div class="social-icon">INST</div>
            <div class="social-icon">TT</div>
            <div class="social-icon">SC</div>
            <div class="social-icon">CLUB</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('panel-container');
        const bg = document.getElementById('bg-parallax');
        
        const musicBtn = document.getElementById('music-trigger');
        const clockBtn = document.getElementById('clock-trigger');
        const pcBtn = document.getElementById('pc-trigger');
        const socialBtn = document.getElementById('toggle-more');

        // Логика кнопок
        musicBtn.onclick = () => { container.classList.toggle('music-open'); musicBtn.classList.toggle('active'); };
        clockBtn.onclick = () => { container.classList.toggle('clock-open'); clockBtn.classList.toggle('active'); };
        pcBtn.onclick = () => { container.classList.toggle('pc-open'); pcBtn.classList.toggle('active'); };
        
        socialBtn.onclick = () => { 
            container.classList.toggle('social-open'); 
            socialBtn.classList.toggle('active');
            socialBtn.textContent = container.classList.contains('social-open') ? "Close" : "More socials";
        };

        // Параллакс
        document.onmousemove = (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            bg.style.transform = `scale(1.1) translate(${x * -20}px, ${y * -20}px)`;
        };
        
        // Время
        function updateClocks() {
            const now = new Date();
            
            // Local
            document.getElementById('time-local').textContent = now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
            
            // USA (New York)
            document.getElementById('time-usa').textContent = now.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', timeZone: 'America/New_York', hour12: false});
            
            // Japan (Tokyo)
            document.getElementById('time-japan').textContent = now.toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit', timeZone: 'Asia/Tokyo', hour12: false});
        }
        setInterval(updateClocks, 1000); updateClocks();
    </script>
</body>
</html>
