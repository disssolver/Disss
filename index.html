<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; perspective: 2000px;
        }

        #bg-parallax {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; object-fit: cover; filter: brightness(0.35) blur(2px);
            transform: scale(1.1); transition: opacity 0.8s ease-in-out;
        }

        .panel-container { position: relative; display: flex; flex-direction: column; align-items: center; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        .glass-base {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(40px) saturate(160%);
            -webkit-backdrop-filter: blur(40px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* КНОПКА PLAYER СВЕРХУ */
        .player-trigger {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 30px; border-radius: 15px; z-index: 1000;
            font-size: 10px; letter-spacing: 2px;
        }

        /* КОМПАКТНЫЙ ПЛЕЕР */
        .top-player-panel {
            position: absolute; top: 0; left: 50%; transform: translate(-50%, -20px);
            width: 320px; height: 65px; border-radius: 20px;
            z-index: 500; opacity: 0; pointer-events: none;
            display: flex; align-items: center; padding: 0 20px; gap: 15px;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .panel-container.player-open .top-player-panel { transform: translate(-50%, -100px); opacity: 1; pointer-events: auto; }

        /* КНОПКА PLAY (КВАДРАТ С ТРЕУГОЛЬНИКОМ) */
        .play-btn {
            width: 35px; height: 35px; border-radius: 10px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .play-icon { 
            width: 0; height: 0; 
            border-top: 6px solid transparent; border-bottom: 6px solid transparent;
            border-left: 10px solid white; margin-left: 3px;
        }
        .pause-icon {
            display: none; width: 10px; height: 12px; border-left: 3px solid white; border-right: 3px solid white;
        }
        .playing .play-icon { display: none; }
        .playing .pause-icon { display: block; }

        /* ПРОГРЕСС-БАР */
        .progress-container { flex-grow: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { width: 0%; height: 100%; background: #fff; border-radius: 2px; transition: width 0.1s linear; }

        /* ОСТАЛЬНОЙ ИНТЕРФЕЙС */
        .card-main { position: relative; z-index: 100; width: 480px; padding: 35px; border-radius: 45px; }
        .nav-links { display: flex; flex-direction: column; flex-grow: 1; padding-top: 5px; }
        .btn {
            color: rgba(255,255,255,0.9); background: rgba(255, 255, 255, 0.06); 
            padding: 14px; border-radius: 20px; font-size: 11px; font-weight: 800; 
            text-transform: uppercase; text-align: center; cursor: pointer; display: block; 
            width: 100%; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; text-decoration: none;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.12); }
        .avatar { width: 130px; height: 130px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.2); object-fit: cover; }
        .profile-top { display: flex; align-items: flex-start; gap: 25px; margin-bottom: 20px; }
        .square-row { display: flex; flex-direction: column; gap: 8px; width: 130px; margin-top: 15px; }
        .btn-short { margin-bottom: 0; padding: 12px 0; font-size: 9px; flex: 1; }
        .row-group { display: flex; gap: 8px; width: 100%; }

        /* БОКОВИНЫ И НИЗ */
        .side-panel { position: absolute; top: 0; z-index: 50; height: 100%; width: 340px; border-radius: 40px; padding: 30px; opacity: 0; pointer-events: none; display: flex; flex-direction: column; }
        .card-music { left: 0; }
        .panel-container.music-open .card-music { transform: translateX(-390px); opacity: 1; pointer-events: auto; }
        .card-pc { right: 0; }
        .panel-container.pc-open .card-pc { transform: translateX(390px); opacity: 1; pointer-events: auto; }
        .card-extra { position: absolute; bottom: 0; left: 0; height: 120px; border-radius: 40px; width: 100%; display: flex; justify-content: space-around; align-items: center; opacity: 0; pointer-events: none; transition: 0.6s; }
        .panel-container.social-open .card-extra { transform: translateY(140px); opacity: 1; pointer-events: auto; }
        .social-icon { width: 80px; height: 80px; background: rgba(255,255,255,0.08); border-radius: 25px; display: flex; justify-content: center; align-items: center; font-weight: 900; text-decoration: none; color: #fff; font-size: 12px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <img src="bg1.jpg" id="bg-parallax">
    <audio id="main-audio" src="track.mp3" loop></audio>

    <div class="glass-base btn player-trigger" id="player-toggle">PLAYER</div>

    <div class="panel-container" id="panel-container">
        
        <div class="glass-base top-player-panel">
            <div class="play-btn" id="play-pause">
                <div class="play-icon"></div>
                <div class="pause-icon"></div>
            </div>
            <div class="progress-container" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="glass-base card-main">
            <div class="profile-top">
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <img src="ava.jpg" class="avatar">
                    <div class="square-row">
                        <div class="btn btn-short" style="background:rgba(255,255,255,0.1); width: 100%; margin-bottom: 8px;" id="next-theme">Next Theme</div>
                        <div class="row-group">
                            <div class="btn btn-short" id="music-trigger">Music</div>
                            <div class="btn btn-short" id="clock-trigger">Time</div>
                        </div>
                    </div>
                </div>
                <div class="nav-links">
                    <a href="https://guns.lol/morfff" target="_blank" class="btn">Telegram</a>
                    <a href="https://discordapp.com/users/1035880231619280926" target="_blank" class="btn">Discord</a>
                    <a href="https://steamcommunity.com/profiles/76561199554598143/" target="_blank" class="btn">Steam</a>
                    <div class="btn" id="pc-trigger">My PC</div>
                </div>
            </div>
            <div class="btn" id="toggle-more" style="margin-bottom: 0;">More socials</div>
        </div>

        <div class="glass-base side-panel card-pc">
            <ul class="item-list"><li>CPU: i5-13400</li><li>GPU: RTX 3060ti</li><li>RAM: 16gb DDR5 6000mhz</li></ul>
        </div>
        <div class="glass-base card-extra">
            <a href="https://guns.lol/morfff" target="_blank" class="social-icon">INST</a>
            <a href="https://socialclub.rockstargames.com/member/-Disssvoler-/" target="_blank" class="social-icon">ROCK</a>
        </div>
    </div>

    <script>
        const container = document.getElementById('panel-container');
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-pause');
        const progressFill = document.getElementById('progress-fill');
        const progressBar = document.getElementById('progress-bar');
        const playerToggle = document.getElementById('player-toggle');

        // Логика плеера
        playerToggle.onclick = () => container.classList.toggle('player-open');

        playBtn.onclick = () => {
            if (audio.paused) {
                audio.play();
                playBtn.classList.add('playing');
            } else {
                audio.pause();
                playBtn.classList.remove('playing');
            }
        };

        audio.ontimeupdate = () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = pct + '%';
        };

        progressBar.onclick = (e) => {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        };

        // Темы и прочее
        const themeBtn = document.getElementById('next-theme');
        const themes = ['bg1.jpg', 'bg2.jpg', 'bg3.jpg', 'bg4.jpg', 'bg5.jpg', 'bg6.jpg', 'bg7.jpg', 'bg8.jpg', 'bg9.jpg', 'bg10.jpg'];
        let currentTheme = 0;
        themeBtn.onclick = () => {
            currentTheme = (currentTheme + 1) % themes.length;
            document.getElementById('bg-parallax').src = themes[currentTheme];
        };

        // Триггеры панелей
        document.getElementById('music-trigger').onclick = () => container.classList.toggle('music-open');
        document.getElementById('pc-trigger').onclick = () => container.classList.toggle('pc-open');
        document.getElementById('toggle-more').onclick = () => container.classList.toggle('social-open');
    </script>
</body>
</html>
