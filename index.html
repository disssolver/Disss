<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Profile</title>
    <style>
        /* Общие настройки страницы */
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif; /* Более чистый шрифт */
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* ЧИСТО ЧЕРНЫЙ ФОН */
        .bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: -2;
        }

        /* ТАБЛИЧКА "ЖИДКОЕ СТЕКЛО" */
        .card {
            /* Квадратная форма (шире, чем была) */
            width: 400px; 
            height: 400px;
            
            /* Эффект Liquid Glass (блюр и прозрачность) */
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            
            /* Граница и закругление */
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            
            /* Тень для объема */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            
            /* Внутренние отступы */
            padding: 30px;
            box-sizing: border-box; /* Чтобы padding не увеличивал размер */
            
            /* Размещение элементов */
            display: flex; flex-direction: column;
            justify-content: space-between;
        }

        /* ВЕРХНЯЯ СЕКЦИЯ (Фото + Кнопки) */
        .top-section {
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Фото слева */
            gap: 25px; /* Отступ между фото и кнопками */
        }

        /* АВАТАРКА СЛЕВА */
        .avatar {
            width: 140px; height: 140px;
            border-radius: 30px; /* Квадратные с закруглением */
            border: 2px solid rgba(255, 255, 255, 0.2);
            object-fit: cover;
        }

        /* БЛОК КНОПОК СПРАВА */
        .links-group {
            display: flex; flex-direction: column;
            gap: 10px; flex-grow: 1; /* Кнопки занимают оставшееся место */
        }

        /* КНОПКИ-ССЫЛКИ */
        .btn {
            display: block; text-decoration: none; color: white;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 15px; border-radius: 12px;
            font-weight: 600; font-size: 14px;
            text-transform: uppercase;
            transition: 0.2s;
            text-align: center;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }

        /* НИК ПО ЦЕНТРУ СНИЗУ */
        h1 {
            margin: 0;
            text-align: center;
            font-size: 40px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(180deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="card">
        <div class="top-section">
            <img src="ava.jpg" class="avatar">
            <div class="links-group">
                <a href="https://t.me/jurabek1608" class="btn">TELEGRAM</a>
                <a href="https://discordapp.com/users/1035880231619280926" class="btn">DISCORD</a>
                <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">STEAM</a>
            </div>
        </div>
        
        <h1>DISSS</h1>
    </div>
</body>
</html>
