<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Bio</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/impact');
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: #000; color: #fff;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://i.pinimg.com/originals/c9/21/53/c921532f6388439363167a5840333333.jpg') no-repeat center center;
            background-size: cover; z-index: -1; filter: brightness(0.4);
        }
        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px; border-radius: 35px;
            text-align: center; width: 300px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .avatar {
            width: 120px; height: 120px;
            border-radius: 50%; border: 3px solid #fff;
            object-fit: cover; margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 32px; text-transform: uppercase; }
        .bio { font-size: 14px; color: #aaa; margin-bottom: 30px; }
        .btn {
            display: block; text-decoration: none; color: #fff;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px; margin: 10px 0; border-radius: 15px;
            font-family: 'Impact', sans-serif; font-size: 18px;
            transition: 0.3s; border: 1px solid rgba(255,255,255,0.1);
        }
        .btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
        .player { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        #playBtn { background: none; border: none; cursor: pointer; fill: #fff; width: 50px; height: 50px; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="card">
        <img src="https://i.pinimg.com/736x/82/72/71/8272718e2098d5f30378e90656711718.jpg" class="avatar">
        <h1>Disss</h1>
        <p class="bio">addicted to games</p>
        <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
        <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
        <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
        <div class="player">
            <button id="playBtn">
                <svg id="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <audio id="audio" loop>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>
    <script>
        const a = document.getElementById('audio');
        const b = document.getElementById('playBtn');
        const i = document.getElementById('icon');
        b.onclick = () => {
            if (a.paused) { a.play(); i.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }
            else { a.pause(); i.innerHTML = '<path d="M8 5v14l11-7z"/>'; }
        };
    </script>
</body>
</html>
