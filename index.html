<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disss | Pro Bio Elite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #000; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; perspective: 2000px;
        }

        #bg-parallax {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1; object-fit: cover;
            filter: brightness(0.45) blur(2px);
            transform: scale(1.1);
            transition: transform 0.5s cubic-bezier(0.1, 0, 0.2, 1);
            will-change: transform;
        }

        .card {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; gap: 25px;
            padding: 40px; min-width: 420px;
            background: rgba(90, 90, 90, 0.7); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 45px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            transition: transform 0.1s ease-out, left 0.6s ease-in-out, top 0.6s ease-in-out;
            transform-style: preserve-3d;
            left: 0; top: 0;
        }

        .profile-top { 
            display: flex; align-items: center; gap: 25px; 
            transform-style: preserve-3d; 
        }

        .ava-box { position: relative; transform-style: preserve-3d; }
        
        .avatar {
            width: 130px; height: 130px; border-radius: 35px;
            object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; position: relative; z-index: 2;
        }

        .ava-glow {
            position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%) translateZ(-1px);
            width: 80%; height: 30%; background: rgba(255, 255, 255, 0);
            filter: blur(20px); transition: all 0.4s ease;
        }

        .avatar:hover { 
            transform: translateY(-20px) scale(1.18) translateZ(15px); 
            border-color: #fff;
        }
        
        .avatar:hover + .ava-glow { 
            background: rgba(255, 255, 255, 0.8); 
            bottom: -15px; 
        }

        .nav-links { 
            display: flex; flex-direction: column; gap: 12px; 
            flex-grow: 1; transform-style: preserve-3d; 
        }

        /* DARKER BUTTONS & DARKER TEXT */
        .btn {
            text-decoration: none; 
            color: rgba(0, 0, 0, 0.7); /* Darker text than table */
            background: rgba(255, 255, 255, 0.15); /* Not so bright */
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px; border-radius: 18px;
            font-size: 14px; font-weight: 900; 
            text-transform: uppercase; text-align: center;
            transition: all 0.2s ease; transform-style: preserve-3d;
        }

        .btn:hover { 
            background: rgba(255, 255, 255, 0.25); 
            color: rgba(0, 0, 0, 0.9);
            transform: translateZ(25px);
        }

        .btn:active { 
            transform: translateZ(-35px) scale(0.85); 
            background: rgba(255, 255, 255, 0.1); 
        }

        .nick-container { margin-top: 20px; text-align: center; }
        
        /* NICKNAME: INVISIBLE UNTIL HOVER */
        .nickname {
            display: inline-block; font-size: 50px; font-weight: 900;
            letter-spacing: 15px; text-transform: uppercase;
            color: transparent; 
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0); /* Invisible */
            transform: none !important;
            transition: all 0.5s ease; cursor: default;
        }

        .nickname:hover {
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 1);
            text-shadow: 0 0 40px rgba(255, 255, 255, 1);
        }
    </style>
</head>
<body>

    <img src="bg.jpg" id="bg-parallax" alt="background">

    <div class="card" id="card">
        <div class="profile-top">
            <div class="ava-box">
                <img src="ava.jpg" alt="Avatar" class="avatar">
                <div class="ava-glow"></div>
            </div>
            <div class="nav-links">
                <a href="https://t.me/jurabek1608" class="btn">Telegram</a>
                <a href="https://discordapp.com/users/1035880231619280926" class="btn">Discord</a>
                <a href="https://steamcommunity.com/profiles/76561199554598143" class="btn">Steam</a>
            </div>
        </div>
        <div class="nick-container">
            <h1 class="nickname">DISSS</h1>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const bg = document.getElementById('bg-parallax');

        // MOUSE TRACKING
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            
            card.style.transform = `rotateX(${y * -25}deg) rotateY(${x * 25}deg)`;
            
            // Low sensitivity for background tracking
            bg.style.transform = `scale(1.1) translate(${x * -15}px, ${y * -15}px)`;
        });

        // CORNER CLICK TELEPORT (NOT SIDES)
        card.addEventListener('click', (e) => {
            // Check if clicking corners (outer 25% of the card area)
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const cornerZone = 100; // Size of the corner detection zone in pixels

            let targetX = 0;
            let targetY = 0;

            const isLeft = x < cornerZone;
            const isRight = x > rect.width - cornerZone;
            const isTop = y < cornerZone;
            const isBottom = y > rect.height - cornerZone;

            // Only trigger if it's a corner (top-left, top-right, bottom-left, bottom-right)
            if ((isLeft || isRight) && (isTop || isBottom)) {
                if (isLeft) targetX = -150;
                if (isRight) targetX = 150;
                if (isTop) targetY = -150;
                if (isBottom) targetY = 150;

                card.style.left = `${targetX}px`;
                card.style.top = `${targetY}px`;
            } else {
                // Optional: Return to center if clicked anywhere else
                card.style.left = "0px";
                card.style.top = "0px";
            }
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            bg.style.transform = `scale(1.1) translate(0, 0)`;
        });
    </script>
</body>
</html>
